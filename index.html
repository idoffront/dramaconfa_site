<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="dramaconfa — Telegram и Discord.">
<title>dramaconfa.134</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%231a6fd6'/><stop offset='1' stop-color='%2357b1f0'/></linearGradient></defs><circle cx='32' cy='32' r='32' fill='url(%23g)'/><text x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='700' fill='%23ffffff' text-anchor='middle'>dC</text></svg>">
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface-hover: #181818;
    --fg: #f5f5f5;
    --muted: #6b6b6b;
    --line: rgba(245, 245, 245, 0.14);
    --line-strong: rgba(245, 245, 245, 0.28);
    --accent: #ff3b30;
    --mono: "SF Mono", "JetBrains Mono", "Fira Code", "IBM Plex Mono",
      "Menlo", "Monaco", "Consolas", "Courier New", monospace;
  }

  html,
  body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(circle, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 26px 26px;
    background-position: 13px 13px;
  }

  main {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 72px 24px 56px;
    position: relative;
  }

  /* Thin corner ticks */
  .tick {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: var(--line-strong);
    border-style: solid;
    border-width: 0;
  }
  .tick.tl { top: 20px; left: 20px; border-top-width: 1px; border-left-width: 1px; }
  .tick.tr { top: 20px; right: 20px; border-top-width: 1px; border-right-width: 1px; }
  .tick.bl { bottom: 20px; left: 20px; border-bottom-width: 1px; border-left-width: 1px; }
  .tick.br { bottom: 20px; right: 20px; border-bottom-width: 1px; border-right-width: 1px; }

  /* Title */
  .title-wrap {
    text-align: center;
    margin-bottom: 64px;
  }

  h1 {
    font-size: clamp(3rem, 11vw, 7rem);
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--fg);
    position: relative;
    display: inline-block;
  }

  /* Small red dot — the Nothing accent */
  h1::after {
    content: "";
    position: absolute;
    top: 0.12em;
    right: -0.35em;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(255, 59, 48, 0.6);
  }

  /* Links */
  .links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    width: 100%;
    max-width: 720px;
    background: var(--line);
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    overflow: hidden;
  }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 34px 30px;
    text-decoration: none;
    color: var(--fg);
    background: var(--surface);
    transition: background-color 180ms ease;
    font-family: var(--mono);
    min-height: 110px;
  }

  .link:hover {
    background: var(--surface-hover);
  }

  .link .label {
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .link .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    color: var(--fg);
    transition: background-color 180ms ease, border-color 180ms ease,
      color 180ms ease;
    flex-shrink: 0;
  }

  .link .icon svg {
    transition: transform 300ms ease;
  }

  .link:hover .icon {
    background: var(--fg);
    border-color: var(--fg);
    color: var(--bg);
  }

  .link:hover .icon svg {
    transform: rotate(-45deg);
  }

  .link:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 1px var(--fg), 0 0 0 2px var(--accent);
    z-index: 2;
  }

  .link:active {
    background: #141414;
  }

  /* Footer */
  footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Responsive */
  @media (max-width: 640px) {
    main {
      padding: 48px 16px 48px;
    }

    .links {
      grid-template-columns: 1fr;
    }

    .link {
      padding: 26px 22px;
      min-height: 92px;
    }

    .link .label {
      font-size: 1.35rem;
    }

    .title-wrap {
      margin-bottom: 48px;
    }

    .tick {
      display: none;
    }

    footer {
      bottom: 18px;
      font-size: 9px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <main role="main" aria-label="dramaconfa">
    <span class="tick tl" aria-hidden="true"></span>
    <span class="tick tr" aria-hidden="true"></span>
    <span class="tick bl" aria-hidden="true"></span>
    <span class="tick br" aria-hidden="true"></span>

    <div class="title-wrap">
      <h1>dramaconfa</h1>
    </div>

    <div class="links">
      <!-- ЗАМЕНИ: ссылка на Telegram -->
      <a class="link" href="https://t.me/dramaconfa" rel="noopener noreferrer" aria-label="Telegram">
        <span class="label">Telegram</span>
        <span class="icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7" />
            <path d="M8 7H17V16" />
          </svg>
        </span>
      </a>

      <!-- ЗАМЕНИ: ссылка на Discord -->
      <a class="link" href="https://discord.com/invite/zBnPuZNUjP" rel="noopener noreferrer" aria-label="Discord">
        <span class="label">Discord</span>
        <span class="icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7" />
            <path d="M8 7H17V16" />
          </svg>
        </span>
      </a>
    </div>

    <footer>© 134 x QWEN</footer>
  </main>
</body>
</html>
