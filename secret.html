<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>SECRET</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #070405;
  --fg: #e8dfda;
  --fg-dim: #706666;
  --accent: #ff1e3c;
  --accent-soft: rgba(255, 30, 60, 0.2);
  --font-display: 'Georgia', serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'Courier New', monospace;
  --quote-size: clamp(2.6rem, 8.5vw, 7rem);
  --quote-weight: 400;
  --quote-italic: italic;
  --corner-size: 0.65rem;
  --radius: 0px;
  --radius-lg: 0px;
  --shadow: none;
  --line-height: 1.05;
  --letter-spacing-quote: -0.03em;
  --transition: 0.7s cubic-bezier(0.2, 0.9, 0.2, 1);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body {
  transition: background var(--transition), color var(--transition);
  cursor: none;
}

/* ============================================
   AMBIENT CANVAS (шум)
   ============================================ */
#ambient {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  mix-blend-mode: overlay;
  transition: opacity 0.6s;
}
.reality-drama #ambient { opacity: 0.15; }

/* ============================================
   AMBIENT CSS LAYERS
   ============================================ */
.ambient-scan {
  position: fixed;
  left: 0; right: 0;
  height: 120px;
  background: linear-gradient(180deg, transparent 0%, rgba(255,30,60,0.08) 50%, transparent 100%);
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  animation: scanMove 7s linear infinite;
}
.reality-drama .ambient-scan { opacity: 1; }
@keyframes scanMove {
  0% { transform: translateY(-200px); }
  100% { transform: translateY(100vh); }
}

.ambient-grid {
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.6s;
}
.reality-material .ambient-grid { opacity: 1; }

/* NOTHING — матричные точки */
.ambient-dots {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.8s;
  overflow: hidden;
}
.reality-nothing .ambient-dots { opacity: 1; }
.ambient-dots .dot-grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(214, 69, 60, 0.3) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: dotPulse 4s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ПОЛОСКА УБРАНА: раньше был .ambient-dots .glyph-line */

.ambient-desktop {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.6s;
}
.reality-win95 .ambient-desktop { opacity: 1; }
.win95-icon {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'MS Sans Serif', 'Arial', sans-serif;
  font-size: 11px;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
}
.win95-icon .ico {
  width: 32px; height: 32px;
  background: #fff;
  border: 1px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #000080;
}
.ico-1 { top: 20px; left: 20px; }
.ico-2 { top: 90px; left: 20px; }
.ico-3 { top: 160px; left: 20px; }

.ambient-aero {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.8s;
  overflow: hidden;
}
.reality-aero .ambient-aero { opacity: 1; }
.cloud { position: absolute; background: rgba(255,255,255,0.6); border-radius: 100px; filter: blur(2px); }
.cloud-1 { width: 200px; height: 60px; top: 15%; left: -20%; animation: cloudMove 50s linear infinite; }
.cloud-2 { width: 300px; height: 80px; top: 40%; left: -30%; animation: cloudMove 70s linear infinite; animation-delay: -20s; }
.cloud-3 { width: 150px; height: 50px; top: 65%; left: -15%; animation: cloudMove 60s linear infinite; animation-delay: -40s; }
@keyframes cloudMove { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 400px)); } }
.bubble {
  position: absolute;
  bottom: -50px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(135,206,235,0.3) 60%, transparent);
  border: 1px solid rgba(255,255,255,0.4);
  animation: bubbleRise 20s linear infinite;
}
.bubble-1 { width: 30px; height: 30px; left: 10%; animation-duration: 18s; }
.bubble-2 { width: 50px; height: 50px; left: 30%; animation-duration: 25s; animation-delay: -5s; }
.bubble-3 { width: 20px; height: 20px; left: 60%; animation-duration: 22s; animation-delay: -10s; }
.bubble-4 { width: 40px; height: 40px; left: 80%; animation-duration: 30s; animation-delay: -15s; }
@keyframes bubbleRise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(-110vh); opacity: 0; } }

/* ============================================
   INTRO
   ============================================ */
.intro {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  color: #ff1e3c;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  animation: introFade 3.5s 0.2s forwards;
  pointer-events: none;
}
.intro .line-1 { font-size: 0.9rem; }
.intro .line-2 { font-size: 0.6rem; color: #706666; letter-spacing: 0.3em; }
.intro .line-3 { font-size: 0.6rem; color: #ff1e3c; opacity: 0.6; letter-spacing: 0.3em; }
@keyframes introFade { 0%, 75% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

/* ============================================
   STAGE & CORNERS
   ============================================ */
.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  z-index: 10;
  padding: 4vh 5vw;
}

.corner {
  position: absolute;
  font-family: var(--font-mono);
  font-size: var(--corner-size);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--fg-dim);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  transition: color var(--transition), font-family var(--transition);
}
.corner.tl { top: 3.5vh; left: 4vw; }
.corner.tr { top: 3.5vh; right: 4vw; align-items: flex-end; }
.corner.bl { bottom: 3.5vh; left: 4vw; }
.corner.br { bottom: 3.5vh; right: 4vw; align-items: flex-end; }
.corner .accent { color: var(--accent); transition: color var(--transition); }
.corner .dim { color: var(--fg-dim); }

.back {
  position: absolute;
  bottom: 3.5vh;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  color: var(--fg-dim);
  text-decoration: none;
  text-transform: uppercase;
  z-index: 25;
  opacity: 0;
  transition: opacity 0.4s, color 0.3s, transform 0.3s;
  cursor: none;
}
.back:hover { color: var(--accent); transform: translateX(-50%) translateY(30px) scale(1.05); }
.stage:hover .back { opacity: 0.5; transform: translateX(-50%) translateY(0); }

/* ============================================
   QUOTE STAGE
   ============================================ */
.quote-stage {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 5vw;
  gap: 2.5rem;
  max-width: 1400px;
  width: 100%;
  z-index: 15;
  transition: all var(--transition);
}

.quote-panel {
  padding: 3rem 4rem;
  border-radius: var(--radius-lg);
  background: transparent;
  box-shadow: var(--shadow);
  transition: all var(--transition);
  position: relative;
}

.kicker {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.5em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 2rem;
  transition: color var(--transition);
  text-align: center;
}

.quote {
  font-family: var(--font-display);
  font-size: var(--quote-size);
  line-height: var(--line-height);
  font-weight: var(--quote-weight);
  font-style: var(--quote-italic);
  letter-spacing: var(--letter-spacing-quote);
  color: var(--fg);
  max-width: 18ch;
  text-align: center;
  transition: color var(--transition), font-family var(--transition);
}
.quote .char {
  display: inline-block;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.5s, transform 0.5s;
}
.quote.revealed .char { opacity: 1; transform: translateY(0); }

.sub {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--fg-dim);
  margin-top: 2rem;
  transition: color var(--transition);
  text-align: center;
}

/* ============================================
   DOCK
   ============================================ */
.dock {
  position: absolute;
  bottom: 3.5vh;
  right: 4vw;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  z-index: 30;
  padding: 0.7rem;
  border-radius: 30px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  transition: all var(--transition);
}
.dock-item {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.03);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: all 0.4s cubic-bezier(0.2, 0.9, 0.2, 1);
  padding: 0;
  outline: none;
}
.dock-item .glyph {
  position: absolute;
  top: -4px;
  right: -4px;
  font-size: 0.7rem;
  color: var(--accent);
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  transform: scale(0.5);
  pointer-events: none;
}
.dock-item .label {
  position: absolute;
  right: calc(100% + 12px);
  top: 50%;
  transform: translateY(-50%) translateX(10px);
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: var(--fg);
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  background: rgba(0,0,0,0.6);
  padding: 4px 10px;
  border-radius: 4px;
}
.dock-item:hover .glyph { opacity: 1; transform: scale(1); }
.dock-item:hover .label { opacity: 1; transform: translateY(-50%) translateX(0); }
.dock-item:hover { transform: translateX(-4px) scale(1.05); background: rgba(255,255,255,0.08); }
.dock-item.active { background: var(--accent); color: #000; border-color: var(--accent); transform: translateX(-2px); }
.dock-item.active .glyph { opacity: 1; transform: scale(1); }

/* ============================================
   TRANSITION OVERLAY
   ============================================ */
.trans { position: fixed; inset: 0; z-index: 500; pointer-events: none; }
.trans-flash {
  position: absolute; inset: 0;
  background: var(--accent);
  opacity: 0;
  mix-blend-mode: screen;
}
.trans.active .trans-flash { animation: transFlash 0.9s ease-out; }
@keyframes transFlash { 0% { opacity: 0; } 20% { opacity: 0.4; } 100% { opacity: 0; } }

.trans-scan {
  position: absolute;
  left: 0; right: 0;
  height: 80px;
  background: linear-gradient(180deg, transparent 0%, var(--accent) 50%, transparent 100%);
  transform: translateY(-100vh);
  opacity: 0;
}
.trans.active .trans-scan { animation: transScan 0.9s ease-out; }
@keyframes transScan {
  0% { transform: translateY(-100vh); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(100vh); opacity: 0; }
}

.trans-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  letter-spacing: 0.6em;
  color: var(--fg);
  text-transform: uppercase;
  opacity: 0;
  padding: 0.8rem 2rem;
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--accent);
}
.trans.active .trans-label { animation: transLabelShow 0.9s; }
@keyframes transLabelShow {
  0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  30%, 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

body.transitioning .quote-stage { animation: stageTransition 0.9s; }
@keyframes stageTransition {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
  40% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); filter: blur(15px); }
  60% { opacity: 0; transform: translate(-50%, -50%) scale(1.03); filter: blur(15px); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
}

/* ============================================
   CURSOR
   ============================================ */
.cursor {
  position: fixed;
  width: 20px; height: 20px;
  border: 1px solid var(--fg);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%, -50%);
  transition: width 0.3s, height 0.3s, border-color 0.3s, background 0.3s;
  mix-blend-mode: difference;
}
.cursor-dot {
  position: fixed;
  width: 4px; height: 4px;
  background: var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 998;
  transform: translate(-50%, -50%);
}
.cursor.hover { width: 50px; height: 50px; background: var(--accent); border-color: var(--accent); }

/* ============================================
   REALITY 1: DRAMACONFA
   ============================================ */
.reality-drama { background: #070405; }
.reality-drama .quote { text-shadow: 0 0 60px rgba(255, 30, 60, 0.2); }
.reality-drama .quote .char {
  animation: dramaGlitch 8s infinite;
  animation-delay: calc(var(--i, 0) * 0.3s);
}
@keyframes dramaGlitch {
  0%, 95%, 100% { transform: translateY(0); opacity: 1; }
  96% { transform: translate(2px, -1px) skewX(2deg); opacity: 0.8; }
  97% { transform: translate(-2px, 1px); opacity: 1; }
  98% { transform: translate(1px, 0); opacity: 0.9; }
}

/* ============================================
   REALITY 2: MATERIAL
   ============================================ */
.reality-material {
  --bg: #f2f2f7;
  --fg: #1d1d1f;
  --fg-dim: #8e8e93;
  --accent: #1a73e8;
  --font-display: 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', 'Courier New', monospace;
  --quote-size: clamp(2.4rem, 6.5vw, 5rem);
  --quote-weight: 300;
  --quote-italic: normal;
  --corner-size: 0.7rem;
  --radius: 12px;
  --radius-lg: 24px;
  --shadow: 0 20px 60px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  --letter-spacing-quote: -0.02em;
  --line-height: 1.2;
  background: #f2f2f7;
}
.reality-material .quote-panel { background: #ffffff; padding: 4rem 5rem; }
.reality-material .dock {
  background: #ffffff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.05);
}
.reality-material .dock-item { border-color: rgba(0,0,0,0.1); background: #f2f2f7; color: #1d1d1f; }
.reality-material .dock-item.active {
  background: #1a73e8;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(26, 115, 232, 0.4);
}
.reality-material .kicker { color: #1a73e8; font-size: 0.75rem; font-weight: 500; }
.reality-material .corner { color: #8e8e93; }
.reality-material .corner .accent { color: #1a73e8; }
.reality-material .back { color: #8e8e93; }
.reality-material .back:hover { color: #1a73e8; }
.dock-item .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(26, 115, 232, 0.5);
  transform: scale(0);
  animation: rippleEffect 0.6s ease-out;
  pointer-events: none;
}
@keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

/* ============================================
   REALITY 3: NOTHING
   ============================================ */
.reality-nothing {
  --bg: #0a0a0a;
  --bg-2: #111111;
  --fg: #ffffff;
  --fg-dim: #666666;
  --accent: #d6453c;
  --accent-soft: rgba(214, 69, 60, 0.2);
  --font-display: 'Space Mono', 'Courier New', monospace;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'Space Mono', 'Courier New', monospace;
  --quote-size: clamp(2.2rem, 7vw, 5.5rem);
  --quote-weight: 400;
  --quote-italic: normal;
  --corner-size: 0.7rem;
  --radius: 0px;
  --radius-lg: 0px;
  --letter-spacing-quote: -0.02em;
  --line-height: 1.15;
  background: #0a0a0a;
}

.reality-nothing .quote-panel {
  background: transparent;
  border: 1px solid rgba(214, 69, 60, 0.3);
  padding: 4rem 5rem;
  position: relative;
}
.reality-nothing .quote-panel::before,
.reality-nothing .quote-panel::after {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  background: #d6453c;
  border-radius: 50%;
}
.reality-nothing .quote-panel::before { top: -3px; left: -3px; }
.reality-nothing .quote-panel::after { bottom: -3px; right: -3px; }

.reality-nothing .quote {
  color: #ffffff;
  font-family: 'Space Mono', 'Courier New', monospace;
  font-weight: 400;
  letter-spacing: 0.02em;
}

.reality-nothing .kicker {
  color: #d6453c;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.4em;
  font-weight: 400;
}

.reality-nothing .sub {
  color: #666666;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
}

.reality-nothing .dock {
  background: rgba(10, 10, 10, 0.8);
  border: 1px solid rgba(214, 69, 60, 0.3);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.reality-nothing .dock-item {
  border-color: rgba(214, 69, 60, 0.3);
  background: rgba(255, 255, 255, 0.02);
  color: #ffffff;
  font-family: 'Space Mono', monospace;
}
.reality-nothing .dock-item.active {
  background: #d6453c;
  color: #000000;
  border-color: #d6453c;
}
.reality-nothing .dock-item:hover {
  background: rgba(214, 69, 60, 0.15);
}
.reality-nothing .dock-item .glyph { color: #d6453c; }

.reality-nothing .corner {
  font-family: 'Space Mono', monospace;
  color: #666666;
  font-size: 0.65rem;
}
.reality-nothing .corner .accent { color: #d6453c; }

.reality-nothing .back {
  color: #666666;
  font-family: 'Space Mono', monospace;
}
.reality-nothing .back:hover { color: #d6453c; }

/* ============================================
   REALITY 4: WINDOWS 95
   ============================================ */
.reality-win95 {
  --bg: #008080;
  --fg: #000000;
  --fg-dim: #000000;
  --accent: #000080;
  --font-display: 'MS Sans Serif', 'Arial', sans-serif;
  --font-body: 'MS Sans Serif', 'Arial', sans-serif;
  --font-mono: 'MS Sans Serif', 'Courier New', monospace;
  --quote-size: 22px;
  --quote-weight: 400;
  --quote-italic: normal;
  --corner-size: 11px;
  --letter-spacing-quote: 0;
  --line-height: 1.4;
  background: #008080;
  cursor: default;
}
.reality-win95 .cursor, .reality-win95 .cursor-dot { display: none; }
.reality-win95 .quote-panel {
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #000000 #000000 #ffffff;
  padding: 0;
  box-shadow: 1px 1px 0 0 #000;
  max-width: 600px;
  width: 100%;
}
.reality-win95 .win95-titlebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 4px;
  background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
  color: #ffffff;
  font-weight: bold;
  font-size: 12px;
  user-select: none;
}
.reality-win95 .win95-titlebar .title { padding-left: 4px; display: flex; align-items: center; gap: 6px; }
.reality-win95 .win95-buttons { display: flex; gap: 2px; }
.reality-win95 .win95-btn {
  width: 16px; height: 14px;
  background: #c0c0c0;
  border: 1px solid;
  border-color: #ffffff #000000 #000000 #ffffff;
  font-size: 9px;
  font-family: 'Marlett', 'Arial', sans-serif;
  color: #000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  padding: 0;
}
.reality-win95 .win95-content { padding: 20px 24px; background: #c0c0c0; }
.reality-win95 .kicker {
  color: #000080;

@keyframes voidGlitch {

  50% { transform: translate(2px, -1px); }
  75% { transform: translate(-1px, -2px); }
}

/* ============================================
   MOBILE ADAPTATION (единственный блок — заменил старый 768px)
   ============================================ */
@media (max-width: 860px) {
  html, body {
    overflow-x: hidden;
    overflow-y: auto;
    cursor: auto;
  }
  body { cursor: auto; }
  .cursor, .cursor-dot { display: none !important; }

  /* --- STAGE: обычный поток, не fixed высота --- */
  .stage {
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 70px 16px 90px 16px;
    overflow: visible;
    display: flex;
    flex-direction: column;
  }

  /* --- QUOTE-STAGE: НЕ absolute, а обычный блок по центру --- */
  .quote-stage {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    transform: none !important;
    margin: auto 0;
    padding: 20px 4px;
    gap: 1.5rem;
    max-width: 100%;
  }

  /* Переопределяем анимацию перехода для мобилки */
  body.transitioning .quote-stage { 
    animation: stageTransitionMobile 0.9s; 
  }
  @keyframes stageTransitionMobile {
    0% { opacity: 1; transform: none; filter: blur(0); }
    40% { opacity: 0; transform: scale(0.96); filter: blur(15px); }
    60% { opacity: 0; transform: scale(1.03); filter: blur(15px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }

  /* --- QUOTE-PANEL --- */
  .quote-panel {
    padding: 1.5rem 1.2rem;
    max-width: 100%;
  }
  .kicker {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    margin-bottom: 1.2rem;
  }
  .quote {
    font-size: clamp(1.6rem, 7.5vw, 2.8rem) !important;
    max-width: none;
    line-height: 1.3;
  }
  .sub {
    font-size: 0.6rem;
    margin-top: 1.2rem;
    letter-spacing: 0.15em;
  }

  /* --- DOCK: fixed снизу --- */
  .dock {
    position: fixed !important;
    bottom: 0 !important;
    left: 0;
    right: 0;
    top: auto !important;
    transform: none !important;
    flex-direction: row;
    justify-content: center;
    gap: 10px;
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    border-radius: 0;
    width: 100%;
    z-index: 100;
  }
  .dock-item {
    width: 42px;
    height: 42px;
    font-size: 0.7rem;
    flex-shrink: 0;
  }
  .dock-item .label { display: none !important; }
  .dock-item:hover { transform: none; }

  /* --- CORNERS --- */
  .corner { font-size: 0.5rem; letter-spacing: 0.15em; }
  .corner.tl { top: 14px; left: 12px; }
  .corner.tr { top: 14px; right: 12px; }
  .corner.bl, .corner.br { display: none; } /* На мобилке не нужны, мешают */

  /* --- BACK link --- */
  .back {
    position: fixed;
    bottom: calc(65px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.55rem;
    opacity: 0.5;
    padding: 8px 16px;
  }
  .stage:hover .back { opacity: 0.7; transform: translateX(-50%); }

  /* --- Win95 --- */
  .reality-win95 .dock {
    flex-direction: row;
    padding: 6px 8px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    border-left: none;
    border-right: none;
    border-bottom: none;
    border-radius: 0;
  }
  .reality-win95 .dock-item { width: 52px; height: 40px; font-size: 10px; }
  .reality-win95 .quote-panel { max-width: 100%; }
  .reality-win95 .win95-content { padding: 14px 16px; }
  .reality-win95 .quote { font-size: 15px !important; }
  .reality-win95 .back { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }

  /* --- Material --- */
  .reality-material .quote-panel { padding: 1.8rem 1.2rem; }

  /* --- Nothing --- */
  .reality-nothing .quote-panel { padding: 1.5rem 1.2rem; }
  .reality-nothing .dock {
    border-left: none;
    border-right: none;
    border-bottom: none;
    border-radius: 0;
  }

  /* --- Aero --- */
  .reality-aero .quote-panel { padding: 1.8rem 1.2rem; }
  .reality-aero .dock {
    border-radius: 0;
  }
}

@media (max-width: 420px) {
  .quote { font-size: clamp(1.4rem, 8.5vw, 2rem) !important; }

<script>
const REALITIES = {
  drama: {
    num: '01',
    kicker: 'Дизайн № 01 — ДРАМА',
    quote: 'Мы не создаём миры.',
    sub: 'очень круто и красиво',
    status: ['СТАТУС', 'ПОВРЕЖДЁН'],
    coord: ['СЕКТОР', 'ПУСТОТА_01'],
    tlabel: 'оригинально?'
  },
  material: {
    num: '02',
    kicker: 'Дизайн № 02 — MATERIAL',
    quote: 'Каждая поверхность —\nокно в другую\nреальность.',
    sub: '— принцип дизайна, 2014',
    status: ['ПОВЕРХНОСТИ', 'ПОДНЯТЫ'],
    coord: ['СЕТКА', 'MATERIAL.IO'],
    tlabel: 'материал дизайн крут'
  },
  nothing: {
    num: '03',
    kicker: 'Дизайн № 03 — NOTHING',
    quote: 'Ничего лишнего.',
    sub: '— nothing,',
    status: ['ГЛУБИНА', 'МИНИМАЛЬНА'],
    coord: ['СЛОЙ', 'NOTHING_03'],
    tlabel: 'ничего'
  },
  win95: {
    num: '04',
    kicker: 'C:\\Users\\WELCOME.TXT',
    quote: 'Добро пожаловать.\nВыберите дизайн\nв меню Пуск.',
    sub: '— C:\\DRAMACONFA\\README.TXT',
    status: ['СТАТУС', 'ГОТОВО'],
    coord: ['ДИСК', 'C:\\Users'],
    tlabel: 'ЗАГРУЗКА...'
  },
  aero: {
    num: '05',
    kicker: 'ДИЗАЙН № 05 — FRUTIGER AERO',
    quote: 'Атмосферно.',
    sub: 'примерно 2007',
    status: ['ЭПОХА', '2004-2013'],
    coord: ['ЭСТЕТИКА', 'AERO_05'],
    tlabel: 'такой стиль просрали!'
  }
};

let currentReality = 'drama';
let transitioning = false;
const isMobile = window.matchMedia('(max-width: 860px)').matches;

const body = document.body;
const trans = document.getElementById('trans');
const transLabel = document.getElementById('transLabel');
const quoteEl = document.getElementById('quote');
const kickerEl = document.getElementById('kicker');
const subEl = document.getElementById('sub');
const counterEl = document.getElementById('counter');
const statusL1 = document.getElementById('statusL1');
const statusL2 = document.getElementById('statusL2');
const coordL1 = document.getElementById('coordL1');
const coordL2 = document.getElementById('coordL2');
const cursor = document.getElementById('cursor');
const cursorDot = document.getElementById('cursorDot');
const dockItems = document.querySelectorAll('.dock-item');
const win95Titlebar = document.querySelector('.win95-titlebar');

function setQuote(text) {
  quoteEl.classList.remove('revealed');
  const lines = text.split('\n');
  quoteEl.innerHTML = lines.map(line => {
    const chars = line.split('').map((ch, i) => {
      const c = ch === ' ' ? '&nbsp;' : ch;
      return `<span class="char" style="transition-delay:${i * 0.02}s;--i:${i}">${c}</span>`;
    }).join('');
    return `<div>${chars}</div>`;
  }).join('');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => quoteEl.classList.add('revealed'));
  });
}

function loadReality(key) {
  const r = REALITIES[key];
  if (!r) return;
  body.className = '';
  body.classList.add('reality-' + key);
  body.dataset.reality = key;
  kickerEl.textContent = r.kicker;
  subEl.textContent = r.sub;
  counterEl.textContent = `DRAMA ${r.num} / 05`;
  statusL1.textContent = r.status[0];
  statusL2.textContent = r.status[1];
  coordL1.textContent = r.coord[0];
  coordL2.textContent = r.coord[1];
  win95Titlebar.style.display = key === 'win95' ? 'flex' : 'none';
  setQuote(r.quote);
  dockItems.forEach(btn => btn.classList.toggle('active', btn.dataset.target === key));
  currentReality = key;
}

function switchReality(target) {
  if (target === currentReality || transitioning) return;
  transitioning = true;
  const r = REALITIES[target];
  transLabel.textContent = r.tlabel;
  trans.classList.add('active');
  body.classList.add('transitioning');
  setTimeout(() => loadReality(target), 450);
  setTimeout(() => {
    trans.classList.remove('active');
    body.classList.remove('transitioning');
    transitioning = false;
  }, 900);
}

dockItems.forEach(btn => {
  btn.addEventListener('click', (e) => {
    switchReality(btn.dataset.target);
    if (currentReality === 'material' || btn.dataset.target === 'material') {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
  });
});

if (!isMobile) {
  let mx = 0, my = 0, cx = 0, cy = 0, dx = 0, dy = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function animateCursor() {
    cx += (mx - cx) * 0.2;
    cy += (my - cy) * 0.2;
    dx += (mx - dx) * 0.4;
    dy += (my - dy) * 0.4;
    cursor.style.left = cx + 'px';
    cursor.style.top = cy + 'px';
    cursorDot.style.left = dx + 'px';
    cursorDot.style.top = dy + 'px';
    requestAnimationFrame(animateCursor);
  }
  animateCursor();
  const hoverables = document.querySelectorAll('.dock-item, .back, a');
  hoverables.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
}

const canvas = document.getElementById('ambient');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth / 3; canvas.height = window.innerHeight / 3; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
function renderNoise() {
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = v;
    img.data[i+1] = v * 0.2;
    img.data[i+2] = v * 0.2;
    img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
setInterval(renderNoise, 100);
renderNoise();

function dramaGlitch() {
  if (currentReality !== 'drama') return;
  const flash = document.createElement('div');
  flash.style.cssText = `position: fixed; inset: 0; background: #ff1e3c; opacity: 0.1; mix-blend-mode: screen; pointer-events: none; z-index: 400;`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 80);
}
setInterval(() => { if (Math.random() < 0.3) dramaGlitch(); }, 7000);

document.querySelector('[data-close]').addEventListener('click', () => {
  if (currentReality !== 'win95') return;
  const dialog = document.createElement('div');
  dialog.style.cssText = `position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; z-index: 1000; font-family: 'MS Sans Serif', Arial, sans-serif; min-width: 300px;`;
  dialog.innerHTML = `
    <div style="background: linear-gradient(90deg, #000080, #1084d0); color: #fff; padding: 3px 6px; font-size: 12px; font-weight: bold;">реальность.exe</div>
    <div style="padding: 20px; display: flex; gap: 16px; align-items: center;">
      <div style="font-size: 32px;">⚠️</div>
      <div style="font-size: 12px;">Невозможно закрыть реальность.<br>Реальности постоянны.</div>
    </div>
    <div style="padding: 8px 20px 12px; text-align: center;">
      <button id="okBtn" style="background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 3px 20px; font-size: 12px; cursor: pointer;">ОК</button>
    </div>
  `;
  document.body.appendChild(dialog);
  document.getElementById('okBtn').addEventListener('click', () => dialog.remove());
});

let typed = '';
document.addEventListener('keydown', e => {
  typed += e.key;
  if (typed.length > 10) typed = typed.slice(-10);
  if (typed.includes('134')) { typed = ''; unlockVoid(); }
});
function unlockVoid() {
  const flash = document.createElement('div');
  flash.style.cssText = `position: fixed; inset: 0; background: #fff; z-index: 2000; pointer-events: none; animation: voidFlash 2s forwards;`;
  const style = document.createElement('style');
  style.textContent = `@keyframes voidFlash { 0%, 100% { opacity: 0; } 10%, 90% { opacity: 1; } }`;
  document.head.appendChild(style);
  document.body.appendChild(flash);
  setTimeout(() => {
    body.className = 'reality-void';
    kickerEl.textContent = 'ПУСТОТА';
    subEl.textContent = '— ты нашёл СЕКРЕЕЕТ. 134';
    counterEl.textContent = 'ДИЗАЙН 00 / ??';
    quoteEl.innerHTML = '<div>здесь нет</div><div>интерфейса.</div>';
    quoteEl.classList.add('revealed');
    setTimeout(() => { flash.remove(); style.remove(); setTimeout(() => loadReality('drama'), 5000); }, 2000);
  }, 500);
}

let quoteClicks = 0, quoteClickTimer;
quoteEl.addEventListener('click', () => {
  if (currentReality !== 'drama') return;
  quoteClicks++;
  clearTimeout(quoteClickTimer);
  quoteClickTimer = setTimeout(() => quoteClicks = 0, 2000);
  if (quoteClicks >= 7) {
    quoteClicks = 0;
    for (let i = 0; i < 5; i++) setTimeout(() => dramaGlitch(), i * 100);
    quoteEl.style.animation = 'vhsCorrupt 2s';
    setTimeout(() => quoteEl.style.animation = '', 2000);
  }
});
const vhsStyle = document.createElement('style');
vhsStyle.textContent = `@keyframes vhsCorrupt {
  0%, 100% { transform: translate(0,0) skewX(0); filter: hue-rotate(0); }
  10% { transform: translate(-5px, 2px) skewX(-3deg); filter: hue-rotate(90deg); }
  20% { transform: translate(3px, -1px) skewX(2deg); }
  30% { transform: translate(-2px, 3px) skewX(-2deg); filter: hue-rotate(-90deg); }
  50% { transform: translate(4px, 0) skewX(3deg); filter: hue-rotate(180deg); }
  70% { transform: translate(-3px, -2px); filter: hue-rotate(60deg); }
}`;
document.head.appendChild(vhsStyle);

document.querySelector('.stage').addEventListener('dblclick', (e) => {
  if (currentReality !== 'aero') return;
  for (let i = 0; i < 3; i++) {
    const bubble = document.createElement('div');
    const size = 20 + Math.random() * 40;
    bubble.style.cssText = `position: fixed; left: ${e.clientX}px; top: ${e.clientY}px; width: ${size}px; height: ${size}px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(135,206,235,0.3) 60%, transparent); border: 1px solid rgba(255,255,255,0.4); pointer-events: none; z-index: 100; animation: bubblePop 3s forwards;`;
    document.body.appendChild(bubble);
    setTimeout(() => bubble.remove(), 3000);
  }
});
const bubbleStyle = document.createElement('style');
bubbleStyle.textContent = `@keyframes bubblePop {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  10% { opacity: 1; transform: translateY(-20px) scale(1); }
  100% { transform: translateY(-400px) scale(0.8); opacity: 0; }
}`;
document.head.appendChild(bubbleStyle);

loadReality('drama');
</script>
